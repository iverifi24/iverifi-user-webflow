<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/new_no_bg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="iVerifi" />
    <link rel="apple-touch-icon" href="/new_no_bg.png" />
    <!--
      Runs before the app. If this browser is too old for the app's styles, or the page is open inside another app's built-in browser
      (Instagram, Facebook, LinkedIn... where the camera and Google sign-in do not work), say so in plain words instead of showing a
      broken page. It never blocks the app and uses only inline styles, so it still reads correctly when the page's CSS does not apply.
    -->
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var inApp = /FBAN|FBAV|FB_IAB|Instagram|LinkedInApp|Snapchat|MicroMessenger|Line\/|Twitter/i.test(ua);
          var css = window.CSS && typeof CSS.supports === "function" ? CSS : null;
          var modern =
            !!css &&
            css.supports("color", "color-mix(in srgb, red, blue)") &&
            css.supports("selector(:has(*))") &&
            typeof Promise.allSettled === "function" &&
            typeof window.fetch === "function";
          if (modern && !inApp) return;
          var text = inApp
            ? "You are in another app's built-in browser. For the camera and sign-in to work, open this page in Safari or Chrome (use the menu and choose Open in browser)."
            : "Your browser is out of date, so some screens may not look or work right. Please update Chrome or Safari.";
          var show = function () {
            var bar = document.createElement("div");
            bar.setAttribute("role", "alert");
            bar.style.cssText =
              "position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#fef3c7;color:#78350f;border-bottom:1px solid #f59e0b;" +
              "padding:10px 44px 10px 14px;font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;";
            bar.textContent = text;
            var close = document.createElement("button");
            close.type = "button";
            close.setAttribute("aria-label", "Dismiss");
            close.textContent = "\u00d7";
            close.style.cssText = "position:absolute;right:8px;top:4px;background:none;border:0;font-size:24px;line-height:1;color:#78350f;cursor:pointer;padding:4px 8px;";
            close.onclick = function () {
              bar.remove();
            };
            bar.appendChild(close);
            document.body.appendChild(bar);
          };
          if (document.body) show();
          else document.addEventListener("DOMContentLoaded", show);
        } catch (e) {
          /* a notice must never be the thing that breaks the page */
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
    <title>Iverifi</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("iverifi-theme");
          document.documentElement.classList.toggle("dark", t !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
